name: Chatbot utility tests

on:
  pull_request:
    paths:
      - 'services/chatbot/src/chatbot/agent_utils.py'
      - 'services/chatbot/src/chatbot/config.py'
      - 'services/chatbot/src/chatbot/tests/**'
      - 'services/chatbot/requirements-dev.txt'
      - '.github/workflows/chatbot-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  utilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/chatbot/requirements-dev.txt
      - run: python -m pytest services/chatbot/src/chatbot/tests/test_agent_utils.py -q
        env:
          PYTHONPATH: services/chatbot/src
      - run: python -m black --check services/chatbot/src/chatbot/agent_utils.py services/chatbot/src/chatbot/tests/test_agent_utils.py

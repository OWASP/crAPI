name: Helm rendering tests

on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'deploy/tests/**'
      - '.github/workflows/helm-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configmaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.16.4'
      - run: python -m pip install -r deploy/tests/requirements.txt
      - run: python -m pytest deploy/tests -q
      - run: helm lint deploy/helm
